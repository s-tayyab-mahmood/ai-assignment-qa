name: Playwright QA + AI RCA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      grep:
        description: 'Optional --grep filter (e.g. @smoke, @P0, @AE-15). Empty = full suite.'
        required: false
        default: ''
      skip_health_check:
        description: 'Skip the pre-run site health check and run the tests immediately.'
        type: boolean
        required: false
        default: false
  schedule:
    # 05:00 Asia/Karachi = 00:00 UTC (Pakistan has no DST). GitHub cron is UTC and only runs from
    # the default branch; scheduled runs can start several minutes late under GitHub load.
    - cron: '0 0 * * *'

# One run per ref at a time: protects the public practice site from overlapping load.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 80 # up to ~30 min waiting for an overloaded site + the suite + up to 20 min self-healing
    env:
      CI: 'true'
      WORKERS: '2'
      BLOCK_ADS: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # commit diff is RCA evidence (changed files vs PR base)

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static gates (type check, lint, RCA classifier self-test)
        run: npm run typecheck && npm run lint && npm run rca:selftest && npm run health:selftest && npm run heal:selftest

      - name: Site health check (wait for an overloaded site instead of failing)
        id: health
        if: github.event.inputs.skip_health_check != 'true'
        # A broken checker must never block testing: on a crash the output stays unset and tests run.
        continue-on-error: true
        env:
          # Scheduled/manual: up to 4 attempts, 10 min apart. Pull requests: 1 attempt, no waiting.
          HEALTH_ATTEMPTS: ${{ github.event_name == 'pull_request' && '1' || '4' }}
          HEALTH_WAIT_MS: '600000'
          HEALTH_SLOW_MS: '10000'
        run: npm run health

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        id: tests
        if: steps.health.outputs.healthy != 'false'
        # Never stop here: diagnostics must run, and the real result is re-applied in the last step.
        continue-on-error: true
        env:
          # Passed via env, never interpolated into the script, to prevent shell injection.
          GREP: ${{ github.event.inputs.grep }}
        run: |
          if [ -n "$GREP" ]; then
            npx playwright test --grep "$GREP"
          else
            npx playwright test
          fi

      - name: Generate deterministic failure bundle
        if: always() && steps.health.outputs.healthy != 'false'
        continue-on-error: true
        run: npm run rca:collect

      - name: RCA (AI-assisted when configured, deterministic otherwise)
        if: always() && steps.health.outputs.healthy != 'false'
        continue-on-error: true
        timeout-minutes: 5
        env:
          # No credential at all on pull_request runs (PR code is untrusted): PRs get the
          # model-free deterministic RCA. Scheduled/manual runs on trusted branches use the
          # AI_API_KEY secret for the provider in repo variable AI_PROVIDER (default: gemini, free tier).
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          AI_MODEL: ${{ vars.AI_MODEL || '' }}
          AI_API_KEY: ${{ github.event_name != 'pull_request' && secrets.AI_API_KEY || '' }}
          AI_MAX_FAILURES: '5'
          AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS || '30000' }}
        run: npm run rca:analyze

      - name: Self-healing agent (proposals only – human review required)
        # Only after a real test failure. Writes validated patches to reports/heal/patches/ and a summary;
        # never commits, pushes or merges, and always restores source files. Pull requests get no AI key
        # (rules-only locator healing, no assertion proposals).
        if: always() && steps.tests.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 20
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          AI_MODEL: ${{ vars.AI_MODEL || '' }}
          AI_API_KEY: ${{ github.event_name != 'pull_request' && secrets.AI_API_KEY || '' }}
          AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS || '30000' }}
          HEAL_MAX_ATTEMPTS: '3'
        run: npm run heal

      - name: Upload reports and RCA artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Propagate test result
        if: always()
        run: |
          if [ "${{ steps.health.outputs.healthy }}" = "false" ]; then
            echo "::error::Site unavailable after the health-check retries - tests were not run (environment problem, not a product verdict). See 'Site health check' in the job summary."
            exit 1
          fi
          echo "Test step outcome: ${{ steps.tests.outcome }}"
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "::error::Playwright tests failed – see RCA summary in the job summary and the qa-report artifact."
            exit 1
          fi
